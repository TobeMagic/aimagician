<!--
  发布会界面（t2）：深色光斑底，一屏一件事；字从模糊里浮出，卡片是毛玻璃、轻回弹落位；截图放进玻璃卡、框出一块；大数字单独一屏。
  The whole film is the spec below, drawn on the canvas by vendor/clip (grammar: t2_keynote_ui, from huashu-art-motion, MIT).
  - Variables fill the "{{…}}" placeholders. Timing and structure live in the cues: `at` is the second the thing first
    shows (a number cue's `at` is when it lands; it starts counting 0.9 s earlier); `word` anchors it to that word of
    the narration once `om voice` has run (skills/huashu-motion/references/grammars.md).
  - Consecutive cards without an image share one screen (up to 3); a card with `image` gets a screen of its own.
  - Pickable regions (0-based like the spec): title · card-<i> (i-th card/step/image cue) · number-<k> · highlight-<k>.
  - Scenes: title → cards-1 → number-1 → screenshot-1 → highlight-1.
-->
<div id="film" data-composition-id="film" data-start="0" data-width="1920" data-height="1080">
  <audio id="om-sound" src="assets/sound.wav" data-start="0" data-duration="30" data-track-index="8" data-volume="1"></audio>
  <!-- lang="en" on the canvas: symbols the fonts lack fall back to the same Latin system face as upstream; all Chinese is in the bundled fonts -->

</div>

<script>
  const tl = gsap.timeline({ paused: true });
  CLIP.mount({
    id: 'film',
    tl,
    apply(spec) {
      for (const q of spec.cues) {
        if (q.data && q.data.icon === 'none') delete q.data.icon;
        if (q.data && q.data.label === '') delete q.data.label;
        if (q.kind === 'card' && 'image' in q && !q.image) delete q.image;   // no screenshot path → a plain feature card
      }
      // the box sits on a screenshot: drop it when there is no screenshot card or no rect
      const hasShot = spec.cues.some((q) => q.image);
      spec.cues = spec.cues.filter((q) => q.kind !== 'highlight' || (hasShot && Array.isArray(q.data && q.data.rect) && q.data.rect.length === 4));
      return spec;
    },
  });
  window.__timelines['film'] = tl;
  OM.music({ bpm: 96, marks: { title: 0 } });
</script>
